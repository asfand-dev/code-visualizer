<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="generator" content="code-visualizer" />
    <title>Code Visualizer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='20' cy='22' r='6' fill='white'/%3E%3Ccircle cx='44' cy='22' r='6' fill='white' opacity='.8'/%3E%3Ccircle cx='32' cy='44' r='7' fill='white'/%3E%3Cpath d='M20 22 L32 44 L44 22' stroke='white' stroke-width='3' fill='none' opacity='.7'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        var theme = 'dark';
        try {
          var forced = new URLSearchParams(window.location.search).get('theme');
          var saved = localStorage.getItem('cv-theme');
          if (forced === 'light' || forced === 'dark') theme = forced;
          else if (saved === 'light' || saved === 'dark') theme = saved;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot"><div class="boot-logo"></div><p>Preparing your code map…</p></div>
    </div>
    <!--CODE_VISUALIZER_DATA-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
